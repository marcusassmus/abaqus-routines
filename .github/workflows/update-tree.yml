name: Update README Tree

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate clickable Markdown tree and update README
        run: |
          python3 -c "
          import os
          import re

          EXCLUDE_DIRS = {'.git', '.github'}
          
          def generate_markdown_tree(dir_path, prefix=''):
              entries = sorted(os.listdir(dir_path))
              entries = [e for e in entries if e not in EXCLUDE_DIRS and not e.startswith('.')]
              
              tree_str = ''
              for i, entry in enumerate(entries):
                  path = os.path.join(dir_path, entry)
                  is_last = (i == len(entries) - 1)
                  connector = '└── ' if is_last else '├── '
                  
                  # Markdown-Link erstellen
                  rel_path = os.path.relpath(path, '.')
                  link = f'[{entry}]({rel_path})'
                  
                  tree_str += f'{prefix}{connector}{link}  \n'
                  
                  if os.path.isdir(path):
                      new_prefix = prefix + ('    ' if is_last else '│   ')
                      tree_str += generate_markdown_tree(path, new_prefix)
                      
              return tree_str

          tree_output = generate_markdown_tree('.')
          replacement = f'<!-- tree:start -->\n{tree_output}<!-- tree:end -->'

          with open('README.md', 'r') as f:
              content = f.read()

          updated_content = re.sub(
              r'<!-- tree:start -->.*?<!-- tree:end -->',
              replacement,
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(updated_content)
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: auto-update clickable tree in README [skip ci]" || echo "No changes to commit"
          git push
